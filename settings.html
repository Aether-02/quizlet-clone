<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - StudyHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="transition.css">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color, #0b0f19);
            color: var(--text-color, #ffffff);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .glass-card {
            background: var(--card-bg, rgba(22, 27, 34, 0.85));
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border, rgba(255, 255, 255, 0.15));
            border-radius: 1rem;
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.3);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            color: white;
            font-weight: 600;
        }
        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: white;
        }
        /* Light Mode Variables */
        body.light-mode {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4 text-white" href="index.html">
                <i class="fa-solid fa-arrow-left me-2"></i> Dashboard
            </a>
            <span class="text-white fw-semibold">Settings</span>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-5" style="max-width: 600px;">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="fw-bold display-6 mb-2">Preferences</h1>
                <p class="text-muted">Customize your study environment and appearance.</p>
            </div>
        </div>

        <div class="glass-card p-4 mb-4">
            <h3 class="h5 fw-bold mb-3"><i class="fa-solid fa-moon me-2 text-indigo"></i> Appearance</h3>
            <hr class="border-secondary opacity-25">
            <div class="d-flex justify-content-between align-items-center py-2">
                <div>
                    <h6 class="mb-1 fw-semibold">Theme Mode</h6>
                    <small class="text-muted">Switch between dark glassmorphism and clean light mode.</small>
                </div>
                <div class="btn-group" role="group" aria-label="Theme Toggle">
                    <button type="button" id="dark-mode-btn" onclick="setTheme('dark')" class="btn btn-outline-light btn-sm px-3">
                        <i class="fa-solid fa-moon me-1"></i> Dark
                    </button>
                    <button type="button" id="light-mode-btn" onclick="setTheme('light')" class="btn btn-outline-light btn-sm px-3">
                        <i class="fa-solid fa-sun me-1"></i> Light
                    </button>
                </div>
            </div>
        </div>

        <div class="text-center">
            <a href="index.html" class="btn btn-primary-custom px-5 py-2 rounded-pill shadow-sm">
                Save & Return to Dashboard
            </a>
        </div>
    </main>

    <script>
        function setTheme(mode) {
            const body = document.body;
            const darkBtn = document.getElementById('dark-mode-btn');
            const lightBtn = document.getElementById('light-mode-btn');

            if (mode === 'light') {
                body.classList.add('light-mode');
                darkBtn.classList.remove('active', 'btn-outline-light');
                darkBtn.classList.add('btn-outline-dark');
                lightBtn.classList.add('active', 'btn-outline-dark');
                lightBtn.classList.remove('btn-outline-light');
                localStorage.setItem('theme', 'light');
            } else {
                body.classList.remove('light-mode');
                lightBtn.classList.remove('active', 'btn-outline-dark');
                lightBtn.classList.add('btn-outline-light');
                darkBtn.classList.add('active', 'btn-outline-light');
                darkBtn.classList.remove('btn-outline-dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            setTheme(savedTheme);
        });
    </script>
</body>
</html>
