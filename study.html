<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Deck - StudyHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/transition.css">
    
    <style>
        :root {
            --bg-main: #fff5f2;
            --card-bg: #ffffff;
            --text-main: #5c4033;
            --text-muted: #8c6d62;
            --accent-peach: #ffb5a7;
            --btn-gradient: linear-gradient(135deg, #ffb5a7 0%, #fcd5ce 100%);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }
        .flashcard-container {
            perspective: 1000px;
            max-width: 700px;
            height: 380px;
            margin: 2rem auto;
            cursor: pointer;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s ease;
            border-radius: 1.25rem;
        }
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem;
            background: var(--card-bg);
            border: 1px solid rgba(216, 164, 127, 0.25);
            border-radius: 1.25rem;
            box-shadow: 0 10px 30px rgba(216, 164, 127, 0.1);
        }
        .card-face.back {
            transform: rotateY(180deg);
            background: #fff9f7;
        }
        .card-text {
            font-size: 1.35rem;
            font-weight: 500;
            text-align: center;
            margin: auto;
            color: var(--text-main);
            overflow-y: auto;
            max-height: 220px;
        }
        .navbar-custom {
            background-color: #ffebe6;
            border-bottom: 1px solid rgba(216, 164, 127, 0.2);
            padding: 0.75rem 1.5rem;
        }
        .btn-custom {
            background: rgba(255, 181, 167, 0.2);
            border: 1px solid rgba(216, 164, 127, 0.3);
            color: var(--text-main);
            transition: background 0.2s;
        }
        .btn-custom:hover {
            background: rgba(255, 181, 167, 0.4);
            color: var(--text-main);
        }
        .btn-primary-custom {
            background: var(--btn-gradient);
            border: none;
            color: var(--text-main);
            font-weight: 600;
        }
        .btn-primary-custom:hover {
            opacity: 0.9;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-6 text-dark" href="index.html">
                <i class="fa-solid fa-arrow-left me-2"></i> Dashboard
            </a>
            <h5 id="deck-title" class="fw-bold m-0 text-truncate px-3 text-center" style="max-width: 300px; color: var(--text-main);">Loading Deck...</h5>
            <div class="d-flex align-items-center gap-2">
                <a id="test-btn" href="#" class="btn btn-primary-custom btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-pen-to-square me-1"></i> Test
                </a>
                <button onclick="shuffleCards()" class="btn btn-custom btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-shuffle me-1"></i> Shuffle
                </button>
                <a href="settings.html" class="btn btn-custom btn-sm rounded-circle p-2" title="Settings">
                    <i class="fa-solid fa-gear"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Study Area -->
    <main class="container my-auto py-4 text-center">
        <div id="loading-spinner" class="py-5">
            <div class="spinner-border text-secondary" role="status"></div>
            <p class="text-muted mt-3">Loading your flashcards...</p>
        </div>

        <div id="study-container" class="d-none">
            <!-- Flashcard -->
            <div class="flashcard-container" onclick="flipCard()">
                <div id="flashcard-element" class="flashcard">
                    <!-- Front (Term) -->
                    <div class="card-face front">
                        <div class="d-flex justify-content-between text-muted small text-uppercase fw-bold">
                            <span>Term</span>
                            <span id="card-counter-front">1 / 1</span>
                        </div>
                        <div id="card-term" class="card-text">Loading term...</div>
                        <div class="text-muted small text-center">Click or press Spacebar to flip</div>
                    </div>
                    <!-- Back (Definition) -->
                    <div class="card-face back">
                        <div class="d-flex justify-content-between text-muted small text-uppercase fw-bold">
                            <span>Definition</span>
                            <span id="card-counter-back">1 / 1</span>
                        </div>
                        <div id="card-definition" class="card-text">Loading definition...</div>
                        <div class="text-muted small text-center">Click or press Spacebar to flip</div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="d-flex justify-content-center align-items-center gap-4 mt-4">
                <button onclick="prevCard()" class="btn btn-custom rounded-circle p-3 shadow-sm" style="width: 50px; height: 50px;">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <span id="nav-counter" class="fs-5 fw-bold" style="color: var(--text-main);">1 / 1</span>
                <button onclick="nextCard()" class="btn btn-custom rounded-circle p-3 shadow-sm" style="width: 50px; height: 50px;">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Script to Fetch and Handle Flashcards -->
    <script>
        let cards = [];
        let currentIndex = 0;
        let isFlipped = false;

        const urlParams = new URLSearchParams(window.location.search);
        const setId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', () => {
            if (!setId) {
                alert('No study set ID provided!');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('test-btn').href = `test.html?id=${setId}`;

            fetch(`backend/get_sets.php?id=${setId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading-spinner').style.display = 'none';
                    if (data.success) {
                        document.getElementById('deck-title').textContent = data.set.title;
                        cards = data.terms || [];
                        if (cards.length === 0) {
                            alert('This study set contains no terms.');
                            window.location.href = 'index.html';
                            return;
                        }
                        document.getElementById('study-container').classList.remove('d-none');
                        renderCard();
                    } else {
                        alert('Error loading set: ' + (data.error || 'Unknown error'));
                        window.location.href = 'index.html';
                    }
                })
                .catch(err => {
                    console.error('Fetch error:', err);
                    alert('Failed to connect to server.');
                });

            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    flipCard();
                } else if (e.code === 'ArrowRight') {
                    nextCard();
                } else if (e.code === 'ArrowLeft') {
                    prevCard();
                }
            });
        });

        function flipCard() {
            const cardEl = document.getElementById('flashcard-element');
            cardEl.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        function renderCard() {
            if (cards.length === 0) return;
            const current = cards[currentIndex];
            
            document.getElementById('card-term').textContent = current.term;
            document.getElementById('card-definition').textContent = current.definition;
            
            const counterText = `${currentIndex + 1} / ${cards.length}`;
            document.getElementById('card-counter-front').textContent = counterText;
            document.getElementById('card-counter-back').textContent = counterText;
            document.getElementById('nav-counter').textContent = counterText;

            if (isFlipped) {
                document.getElementById('flashcard-element').classList.remove('flipped');
                isFlipped = false;
            }
        }

        function nextCard() {
            if (currentIndex < cards.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function shuffleCards() {
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            currentIndex = 0;
            renderCard();
        }
    </script>
</body>
</html>
