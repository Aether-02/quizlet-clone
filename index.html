<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Dashboard - Quizlet Clone</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0d1117;
            color: #f0f6fc;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(22, 27, 34, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.4);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            color: white;
            font-weight: 600;
        }
        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: white;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary opacity-90 px-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4 text-indigo" href="index.html">
                <i class="fa-solid fa-graduation-cap me-2 text-indigo"></i> StudyHub
            </a>
            <div class="d-flex">
                <a href="create-set.html" class="btn btn-primary-custom px-4 py-2 rounded-pill shadow-sm">
                    <i class="fa-solid fa-plus me-2"></i> Create Study Set
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-5">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="fw-bold display-6">Study Dashboard</h1>
                <p class="text-muted">Explore your decks, master your topics, and ace your exams.</p>
            </div>
        </div>

        <!-- Loading State / Error Alert -->
        <div id="loading-spinner" class="text-center py-5">
            <div class="spinner-border text-indigo" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-3">Loading your study sets from the server...</p>
        </div>

        <div id="error-alert" class="alert alert-danger d-none" role="alert">
            Failed to load study sets from the server. Please check your connection or database configuration.
        </div>

        <!-- Study Sets Grid -->
        <div id="sets-grid" class="row g-4">
            <!-- Dynamically populated sets will appear here -->
        </div>
    </main>

    <!-- JavaScript to Fetch and Render Study Sets -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const setsGrid = document.getElementById('sets-grid');
            const loadingSpinner = document.getElementById('loading-spinner');
            const errorAlert = document.getElementById('error-alert');

            fetch('backend/get_sets.php')
                .then(response => response.json())
                .then(data => {
                    loadingSpinner.style.display = 'none';
                    if (data.success) {
                        displaySets(data.sets); // Pass data.sets here!
                    } else {
                        errorAlert.classList.remove('d-none');
                        errorAlert.textContent = data.error || "Failed to load study sets.";
                    }
                })
                .catch(err => {
                    loadingSpinner.style.display = 'none';
                    errorAlert.classList.remove('d-none');
                    console.error('Fetch error:', err);
                });

            function displaySets(sets) {
                if (!sets || sets.length === 0) {
                    setsGrid.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <p class="text-muted fs-5">No study sets found yet. Create your first one!</p>
                        </div>
                    `;
                    return;
                }

                setsGrid.innerHTML = sets.map(set => `
                    <div class="col-md-4">
                        <div class="glass-card p-4 h-d-flex flex-column justify-content-between h-100">
                            <div>
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <span class="badge bg-secondary bg-opacity-25 text-indigo px-3 py-2 rounded-pill">
                                        ${set.term_count || 0} terms
                                    </span>
                                    <small class="text-muted">${new Date(set.created_at).toLocaleDateString()}</small>
                                </div>
                                <h3 class="h5 fw-bold text-white mb-2">${escapeHtml(set.title)}</h3>
                                <p class="text-muted small mb-4">${escapeHtml(set.description || 'No description provided.')}</p>
                            </div>
                            <div>
                                <a href="study.html?id=${set.id}" class="btn btn-outline-light btn-sm w-100 rounded-pill py-2 fw-semibold">
                                    <i class="fa-solid fa-bolt me-2"></i> Study Deck
                                </a>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            function escapeHtml(str) {
                return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
            }
        });
    </script>
</body>
</html>
