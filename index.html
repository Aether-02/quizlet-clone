<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Dashboard - Quizlet Clone</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="transition.css">
    
    <!-- Global Light Mode Styles & Script -->
    <style>
        /* Global Light Mode Overrides for All Pages */
        body.light-mode {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        body.light-mode .glass-card,
        body.light-mode .card-face,
        body.light-mode .modal-content {
            background: rgba(255, 255, 255, 0.9) !important;
            border-color: rgba(0, 0, 0, 0.1) !important;
            color: #0f172a !important;
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.08) !important;
        }
        body.light-mode .text-bright,
        body.light-mode h1, body.light-mode h3, body.light-mode h5,
        body.light-mode .card-text {
            color: #0f172a !important;
        }
        body.light-mode .text-muted-bright {
            color: #475569 !important;
        }
        body.light-mode .form-control {
            background-color: #f1f5f9 !important;
            color: #0f172a !important;
            border-color: rgba(0, 0, 0, 0.2) !important;
        }
    </style>
    <script>
        // Apply saved theme immediately on page load
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light-mode');
            document.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('light-mode');
            });
        }
    </script>

    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.6);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            color: white;
            font-weight: 600;
        }
        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: white;
        }
        .text-bright { color: #ffffff !important; }
        .text-muted-bright { color: #cbd5e1 !important; }
        
        /* Modal Customization for Square Boxes & Dark Glass Theme */
        .modal-content {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 0.5rem;
        }
        .form-control, .form-control:focus {
            background-color: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 0.375rem;
        }
        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4 text-white" href="index.html">
                <i class="fa-solid fa-graduation-cap me-2 text-indigo"></i> StudyHub
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="settings.html" class="btn btn-outline-light btn-sm rounded-circle p-2" title="Settings">
                    <i class="fa-solid fa-gear"></i>
                </a>
                <a href="create-set.html" class="btn btn-primary-custom px-4 py-2 rounded-pill shadow-sm">
                    <i class="fa-solid fa-plus me-2"></i> Create Study Set
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-5">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="fw-bold display-6 text-bright">Study Dashboard</h1>
                <p class="text-muted-bright">Explore your decks, master your topics, and ace your exams.</p>
            </div>
        </div>

        <!-- Loading State / Error Alert -->
        <div id="loading-spinner" class="text-center py-5">
            <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted-bright mt-3">Loading your study sets from the server...</p>
        </div>

        <div id="error-alert" class="alert alert-danger d-none" role="alert">
            Failed to load study sets from the server. Please check your connection or database configuration.
        </div>

        <!-- Study Sets Grid -->
        <div id="sets-grid" class="row g-4"></div>
    </main>

    <!-- Edit / Update Modal Popup -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content p-3">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold text-bright" id="editModalLabel">Edit Study Set</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-set-form">
                        <input type="hidden" id="edit-set-id">
                        <div class="mb-3">
                            <label for="edit-title" class="form-label text-muted-bright fw-semibold">Title</label>
                            <input type="text" class="form-control" id="edit-title" required>
                        </div>
                        <div class="mb-4">
                            <label for="edit-description" class="form-label text-muted-bright fw-semibold">Description</label>
                            <textarea class="form-control" id="edit-description" rows="2"></textarea>
                        </div>

                        <hr class="border-secondary opacity-50 my-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="text-bright m-0">Terms & Definitions</h5>
                            <button type="button" class="btn btn-outline-light btn-sm rounded-0 px-3" onclick="addTermRow()">
                                <i class="fa-solid fa-plus me-1"></i> Add Card
                            </button>
                        </div>

                        <div id="edit-terms-container" class="d-flex flex-column gap-3">
                            <!-- Dynamic terms injected here -->
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-outline-light rounded-0 px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary-custom rounded-0 px-4" onclick="saveUpdatedSet()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript to Fetch, Render, Edit Popup, and Delete Study Sets -->
    <script>
        let editModalInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            const setsGrid = document.getElementById('sets-grid');
            const loadingSpinner = document.getElementById('loading-spinner');
            const errorAlert = document.getElementById('error-alert');
            editModalInstance = new bootstrap.Modal(document.getElementById('editModal'));

            function loadSets() {
                fetch('backend/get_sets.php')
                    .then(response => response.json())
                    .then(data => {
                        loadingSpinner.style.display = 'none';
                        if (data.success) {
                            displaySets(data.sets);
                        } else {
                            errorAlert.classList.remove('d-none');
                            errorAlert.textContent = data.error || "Failed to load study sets.";
                        }
                    })
                    .catch(err => {
                        loadingSpinner.style.display = 'none';
                        errorAlert.classList.remove('d-none');
                        console.error('Fetch error:', err);
                    });
            }

            loadSets();

            window.deleteSet = function(setId) {
                if (confirm('Are you sure you want to delete this study set?')) {
                    fetch(`backend/delete_set.php?id=${setId}`, { method: 'DELETE' })
                        .then(res => res.json())
                        .then(data => {
                            if (data.success) {
                                loadSets();
                            } else {
                                alert('Error deleting set: ' + (data.error || 'Unknown error'));
                            }
                        })
                        .catch(err => {
                            console.error('Delete error:', err);
                            alert('Failed to delete study set.');
                        });
                }
            };

            window.openEditModal = function(setId) {
                fetch(`backend/get_sets.php?id=${setId}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            document.getElementById('edit-set-id').value = data.set.id;
                            document.getElementById('edit-title').value = data.set.title;
                            document.getElementById('edit-description').value = data.set.description || '';
                            
                            const container = document.getElementById('edit-terms-container');
                            container.innerHTML = '';
                            
                            if (data.terms && data.terms.length > 0) {
                                data.terms.forEach(term => {
                                    addTermRow(term.term, term.definition);
                                });
                            }
                            editModalInstance.show();
                        } else {
                            alert('Failed to load set details.');
                        }
                    })
                    .catch(err => {
                        console.error('Error opening edit modal:', err);
                        alert('Could not connect to server.');
                    });
            };

            function displaySets(sets) {
                if (!sets || sets.length === 0) {
                    setsGrid.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <p class="text-muted-bright fs-5">No study sets found yet. Create your first one!</p>
                        </div>
                    `;
                    return;
                }

                setsGrid.innerHTML = sets.map(set => `
                    <div class="col-md-4">
                        <div class="glass-card p-4 d-flex flex-column justify-content-between h-100">
                            <div>
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <span class="badge px-3 py-2 rounded-pill fw-semibold" style="background: rgba(99, 102, 241, 0.2); color: #818cf8;">
                                        ${set.term_count || 0} terms
                                    </span>
                                    <small class="text-muted-bright">${new Date(set.created_at).toLocaleDateString()}</small>
                                </div>
                                <h3 class="h5 fw-bold text-bright mb-2">${escapeHtml(set.title)}</h3>
                                <p class="text-muted-bright small mb-4">${escapeHtml(set.description || 'No description provided.')}</p>
                            </div>
                            <div class="d-flex gap-2">
                                <a href="study.html?id=${set.id}" class="btn btn-primary-custom btn-sm flex-grow-1 rounded-pill py-2 fw-semibold">
                                    <i class="fa-solid fa-bolt me-1"></i> Study
                                </a>
                                <button onclick="openEditModal(${set.id})" class="btn btn-outline-light btn-sm rounded-pill px-3 py-2" title="Edit Set">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button onclick="deleteSet(${set.id})" class="btn btn-outline-danger btn-sm rounded-pill px-3 py-2" title="Delete Set">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            window.addTermRow = function(termVal = '', defVal = '') {
                const container = document.getElementById('edit-terms-container');
                const cardDiv = document.createElement('div');
                cardDiv.className = 'glass-card p-3 position-relative';
                cardDiv.innerHTML = `
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label small text-muted-bright">Term</label>
                            <input type="text" class="form-control term-input" value="${escapeHtml(termVal)}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small text-muted-bright">Definition</label>
                            <textarea class="form-control def-input" rows="2" required>${escapeHtml(defVal)}</textarea>
                        </div>
                        <div class="col-md-1 d-flex align-items-center justify-content-center">
                            <button type="button" class="btn btn-outline-danger btn-sm rounded-0 mt-3" onclick="this.closest('.glass-card').remove()">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(cardDiv);
            };

            window.saveUpdatedSet = function() {
                const setId = document.getElementById('edit-set-id').value;
                const title = document.getElementById('edit-title').value.trim();
                const description = document.getElementById('edit-description').value.trim();
                
                const termCards = document.querySelectorAll('#edit-terms-container .glass-card');
                const terms = [];

                termCards.forEach(card => {
                    const term = card.querySelector('.term-input').value.trim();
                    const definition = card.querySelector('.def-input').value.trim();
                    if (term && definition) {
                        terms.push({ term, definition });
                    }
                });

                if (!title || terms.length === 0) {
                    alert('Please provide a title and at least one complete term and definition.');
                    return;
                }

                fetch('backend/update_set.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: setId, title, description, terms })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        editModalInstance.hide();
                        loadSets();
                    } else {
                        alert('Error updating set: ' + (data.error || 'Unknown error'));
                    }
                })
                .catch(err => {
                    console.error('Update error:', err);
                    alert('Failed to connect to server.');
                });
            };

            function escapeHtml(str) {
                return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
            }
        });
    </script>
</body>
</html>
