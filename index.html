<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quizlet Clone</title>
    <!-- Google Fonts & Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Global Smooth Animation */
        * {
            transition: all 0.5s ease !important;
        }

        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-glass: rgba(255, 255, 255, 0.12);
            --accent-glow: #6366f1;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        /* Glassmorphism Container */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 1rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card-hover:hover {
            border-color: var(--accent-glow);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px 0 rgba(99, 102, 241, 0.3);
        }

        .form-control, .form-control:focus {
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            border-radius: 0.75rem;
        }

        .form-control:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }

        .btn-custom-accent {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 0.75rem;
        }

        .btn-custom-accent:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .set-card {
            height: 100%;
        }

        .text-clamp {
            display: -webkit-box;
            line-clamp: 2;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .action-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
        }

        .action-icon-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .action-icon-btn.text-danger:hover {
            color: #ef4444 !important;
            background: rgba(239, 68, 68, 0.15);
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h2 class="fw-bold mb-1 text-light"><i class="fa-solid fa-graduation-cap text-indigo me-2"></i> Study Dashboard</h2>
                <p class="text-muted mb-0">Explore your decks and master your topics.</p>
            </div>
            <a href="create-set.html" class="btn btn-custom-accent px-4 py-2">
                <i class="fa-solid fa-plus me-2"></i> Create Study Set
            </a>
        </div>

        <!-- Sets Grid -->
        <div id="setsGrid" class="row g-4">
            <!-- Dynamically injected study sets will appear here -->
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="glass-card modal-content p-3" style="background: rgba(11, 15, 25, 0.95);">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold text-light">Edit Study Set</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
                    <form id="editSetForm">
                        <input type="hidden" id="editSetId">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-light">TITLE</label>
                            <input type="text" class="form-control" id="editTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold text-light">DESCRIPTION</label>
                            <textarea class="form-control" id="editDescription" rows="2"></textarea>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="fw-bold text-light mb-0">Terms & Definitions</h6>
                            <button type="button" id="addEditCardBtn" class="btn btn-outline-light btn-sm rounded-pill px-3">+ Add Card</button>
                        </div>
                        <div id="editCardsContainer" class="d-flex flex-column gap-3">
                            <!-- Dynamic edit card rows -->
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-outline-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="saveEditBtn" class="btn btn-custom-accent rounded-pill px-4">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dashboard Script -->
    <script>
        let allSetsData = [];
        const editModal = new bootstrap.Modal(document.getElementById('editModal'));

        async function fetchStudySets() {
            const setsGrid = document.getElementById('setsGrid');
            try {
                const response = await fetch('backend/get_sets.php');
                const sets = await response.json();
                allSetsData = sets;

                if (sets.error) {
                    setsGrid.innerHTML = `<div class="col-12 text-center text-danger"><p>${sets.error}</p></div>`;
                    return;
                }

                if (sets.length === 0) {
                    setsGrid.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <div class="glass-card p-5 mx-auto" style="max-width: 500px;">
                                <i class="fa-solid fa-folder-open fa-3x text-muted mb-3"></i>
                                <h4 class="fw-semibold text-light">No study sets found</h4>
                                <p class="text-muted small mb-4">Create your first study set to start learning right away!</p>
                                <a href="create-set.html" class="btn btn-custom-accent px-4 py-2">Create Set Now</a>
                            </div>
                        </div>
                    `;
                    return;
                }

                setsGrid.innerHTML = '';
                sets.forEach(set => {
                    const col = document.createElement('div');
                    col.className = 'col-md-4';
                    col.innerHTML = `
                        <div class="glass-card glass-card-hover p-4 d-flex flex-column justify-content-between set-card">
                            <div>
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <span class="badge bg-primary bg-opacity-25 text-primary border border-primary px-2 py-1 rounded-pill small fw-semibold">${set.term_count || 0} terms</span>
                                    <div class="d-flex align-items-center gap-1">
                                        <!-- Edit SVG Button -->
                                        <button class="action-icon-btn edit-btn" data-id="${set.id}" title="Edit Set">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                        </button>
                                        <!-- Delete SVG Button -->
                                        <button class="action-icon-btn text-danger delete-btn" data-id="${set.id}" title="Delete Set">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                        </button>
                                    </div>
                                </div>
                                <div class="card-clickable" onclick="window.location.href='study.html?id=${set.id}'" style="cursor: pointer;">
                                    <h4 class="fw-bold text-light mb-2 text-truncate">${escapeHtml(set.title)}</h4>
                                    <p class="text-muted small mb-4 text-clamp">${escapeHtml(set.description || 'No description provided.')}</p>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center border-top border-secondary pt-3 mt-auto card-clickable" onclick="window.location.href='study.html?id=${set.id}'" style="cursor: pointer;">
                                <span class="small text-muted"><i class="fa-regular fa-clock me-1"></i> ${new Date(set.created_at).toLocaleDateString()}</span>
                                <span class="btn btn-outline-light btn-sm rounded-pill px-3">Study <i class="fa-solid fa-arrow-right ms-1"></i></span>
                            </div>
                        </div>
                    `;
                    setsGrid.appendChild(col);
                });

                attachEventListeners();

            } catch (err) {
                console.error(err);
                setsGrid.innerHTML = `<div class="col-12 text-center text-danger"><p>Failed to load study sets from the server.</p></div>`;
            }
        }

        function attachEventListeners() {
            // Delete buttons
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const setId = btn.getAttribute('data-id');
                    if (confirm('Are you sure you want to delete this study set?')) {
                        const res = await fetch('backend/delete_set.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id: setId })
                        });
                        const result = await res.json();
                        if (result.success) {
                            fetchStudySets();
                        } else {
                            alert('Error deleting set: ' + result.error);
                        }
                    }
                });
            });

            // Edit buttons
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const setId = btn.getAttribute('data-id');
                    
                    // Fetch full set details including terms
                    const res = await fetch(`backend/get_sets.php?id=${setId}`);
                    const setData = await res.json();

                    if (setData.error) {
                        alert(setData.error);
                        return;
                    }

                    document.getElementById('editSetId').value = setData.id;
                    document.getElementById('editTitle').value = setData.title;
                    document.getElementById('editDescription').value = setData.description || '';

                    const container = document.getElementById('editCardsContainer');
                    container.innerHTML = '';
                    setData.terms.forEach(t => {
                        addEditCardRow(t.term, t.definition);
                    });

                    editModal.show();
                });
            });
        }

        function addEditCardRow(term = '', definition = '') {
            const container = document.getElementById('editCardsContainer');
            const row = document.createElement('div');
            row.className = 'glass-card p-3 edit-card-row';
            row.innerHTML = `
                <div class="d-flex justify-content-between mb-2">
                    <span class="small fw-bold text-muted">CARD</span>
                    <button type="button" class="btn btn-link text-danger p-0 remove-edit-row"><i class="fa-solid fa-trash-can"></i></button>
                </div>
                <div class="row g-2">
                    <div class="col-md-6"><textarea class="form-control term-input" rows="2" placeholder="Term" required>${term}</textarea></div>
                    <div class="col-md-6"><textarea class="form-control def-input" rows="2" placeholder="Definition" required>${definition}</textarea></div>
                </div>
            `;
            row.querySelector('.remove-edit-row').addEventListener('click', () => {
                if (container.children.length > 2) {
                    row.remove();
                } else {
                    alert('Study set must have at least 2 cards.');
                }
            });
            container.appendChild(row);
        }

        document.getElementById('addEditCardBtn').addEventListener('click', () => addEditCardRow());

        document.getElementById('saveEditBtn').addEventListener('click', async () => {
            const id = document.getElementById('editSetId').value;
            const title = document.getElementById('editTitle').value.trim();
            const description = document.getElementById('editDescription').value.trim();
            const rows = document.querySelectorAll('.edit-card-row');

            const terms = [];
            rows.forEach(r => {
                const term = r.querySelector('.term-input').value.trim();
                const definition = r.querySelector('.def-input').value.trim();
                if (term && definition) {
                    terms.push({ term, definition });
                }
            });

            if (!title || terms.length < 2) {
                alert('Please provide a title and at least 2 complete cards.');
                return;
            }

            const res = await fetch('backend/update_set.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, title, description, terms })
            });

            const result = await res.json();
            if (result.success) {
                editModal.hide();
                fetchStudySets();
            } else {
                alert('Error updating set: ' + result.error);
            }
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        fetchStudySets();
    </script>
</body>
</html>
