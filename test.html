<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Mode - Quizlet Clone</title>
    <!-- Google Fonts & Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Global Smooth Animation */
        * {
            transition: all 0.5s ease !important;
        }

        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.85);
            --border-glass: rgba(255, 255, 255, 0.12);
            --accent-glow: #6366f1;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        /* Glassmorphism Container */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 1rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .form-control, .form-check-input {
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
        }

        .form-control:focus {
            background: rgba(31, 41, 55, 0.9);
            border-color: var(--accent-glow);
            color: var(--text-main);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }

        .form-check-input:checked {
            background-color: var(--accent-glow);
            border-color: var(--accent-glow);
        }

        .btn-custom-accent {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 0.75rem;
        }

        .btn-custom-accent:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .question-card {
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="container py-5" style="max-width: 800px;">
        <!-- Top Navigation Bar -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a id="backLink" href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="fa-solid fa-arrow-left me-1"></i> Exit Test
            </a>
            <h3 id="setTitle" class="fw-bold text-light mb-0 text-truncate mx-3">Loading Test...</h3>
            <span id="questionCountBadge" class="badge bg-primary bg-opacity-25 text-primary border border-primary px-3 py-2 rounded-pill">Test Mode</span>
        </div>

        <!-- Score Results Card (Hidden Initially) -->
        <div id="resultsCard" class="glass-card p-5 text-center mb-4 d-none">
            <i class="fa-solid fa-award fa-3x text-indigo mb-3" style="color: #818cf8;"></i>
            <h2 class="fw-bold text-light mb-2">Test Completed!</h2>
            <p class="text-muted mb-4">Here is how you performed on this study set.</p>
            <h1 id="scoreDisplay" class="display-3 fw-bold text-light mb-4">0%</h1>
            <div class="d-flex justify-content-center gap-3">
                <button onclick="window.location.reload()" class="btn btn-outline-light px-4 py-2 rounded-pill">Retake Test</button>
                <a id="backToStudyBtn" href="#" class="btn btn-custom-accent px-4 py-2">Back to Flashcards</a>
            </div>
        </div>

        <!-- Test Form Container -->
        <form id="testForm">
            <div id="questionsContainer">
                <!-- Dynamically generated test questions will appear here -->
            </div>
            
            <div id="submitContainer" class="d-flex justify-content-end mt-4">
                <button type="submit" class="btn btn-custom-accent btn-lg px-5 py-3">
                    <i class="fa-solid fa-check-double me-2"></i> Submit Test
                </button>
            </div>
        </form>
    </div>

    <!-- Test Script Logic -->
    <script>
        let setTerms = [];
        let generatedQuestions = [];

        const urlParams = new URLSearchParams(window.location.search);
        const setId = urlParams.get('id');

        const setTitleEl = document.getElementById('setTitle');
        const questionsContainer = document.getElementById('questionsContainer');
        const testForm = document.getElementById('testForm');
        const resultsCard = document.getElementById('resultsCard');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const submitContainer = document.getElementById('submitContainer');
        const backToStudyBtn = document.getElementById('backToStudyBtn');

        async function loadTestData() {
            if (!setId) {
                alert('No study set specified!');
                window.location.href = 'index.html';
                return;
            }

            backToStudyBtn.href = `study.html?id=${setId}`;

            try {
                const response = await fetch(`backend/get_sets.php?id=${setId}`);
                const data = await response.json();

                if (data.error) {
                    alert(data.error);
                    window.location.href = 'index.html';
                    return;
                }

                setTitleEl.textContent = `Test: ${data.title}`;
                setTerms = data.terms || [];

                if (setTerms.length < 2) {
                    alert('You need at least 2 terms in a set to generate a test.');
                    window.location.href = `study.html?id=${setId}`;
                    return;
                }

                buildTestQuestions();
            } catch (err) {
                console.error(err);
                alert('Failed to load study set data.');
            }
        }

        function buildTestQuestions() {
            generatedQuestions = [];
            
            // Shuffle terms to randomize test order
            const shuffled = [...setTerms].sort(() => 0.5 - Math.random());

            shuffled.forEach((item, index) => {
                // Decide question type randomly: 0 = Multiple Choice, 1 = True/False, 2 = Written
                const qType = index % 3;

                if (qType === 0 && setTerms.length >= 4) {
                    // Multiple Choice
                    const wrongOptions = setTerms
                        .filter(t => t.id !== item.id)
                        .sort(() => 0.5 - Math.random())
                        .slice(0, 3)
                        .map(t => t.definition);
                    
                    const options = [...wrongOptions, item.definition].sort(() => 0.5 - Math.random());

                    generatedQuestions.push({
                        type: 'mc',
                        question: item.term,
                        correct: item.definition,
                        options: options
                    });
                } else if (qType === 1) {
                    // True / False
                    const isTrue = Math.random() < 0.5;
                    let displayDef = item.definition;

                    if (!isTrue && setTerms.length > 1) {
                        const randomOther = setTerms.find(t => t.id !== item.id);
                        displayDef = randomOther ? randomOther.definition : "Incorrect Definition";
                    }

                    generatedQuestions.push({
                        type: 'tf',
                        question: item.term,
                        statement: displayDef,
                        correct: isTrue ? 'True' : 'False'
                    });
                } else {
                    // Written Input
                    generatedQuestions.push({
                        type: 'written',
                        question: item.term,
                        correct: item.definition.trim()
                    });
                }
            });

            renderQuestions();
        }

        function renderQuestions() {
            questionsContainer.innerHTML = '';
            generatedQuestions.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = 'glass-card p-4 question-card';
                
                let innerHtml = `<h5 class="fw-bold text-light mb-3">Q${idx + 1}. What is the definition of: <span class="text-indigo" style="color: #818cf8;">"${escapeHtml(q.question)}"</span>?</h5>`;

                if (q.type === 'mc') {
                    innerHtml += `<div class="d-flex flex-column gap-2">`;
                    q.options.forEach((opt, oIdx) => {
                        innerHtml += `
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="q_${idx}" id="q_${idx}_${oIdx}" value="${escapeHtml(opt)}" required>
                                <label class="form-check-label text-light" for="q_${idx}_${oIdx}">${escapeHtml(opt)}</label>
                            </div>`;
                    });
                    innerHtml += `</div>`;
                } else if (q.type === 'tf') {
                    innerHtml += `<p class="text-muted small mb-2">Statement: <em>"${escapeHtml(q.statement)}"</em></p>`;
                    innerHtml += `
                        <div class="d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="q_${idx}" id="q_${idx}_true" value="True" required>
                                <label class="form-check-label text-light" for="q_${idx}_true">True</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="q_${idx}" id="q_${idx}_false" value="False" required>
                                <label class="form-check-label text-light" for="q_${idx}_false">False</label>
                            </div>
                        </div>`;
                } else if (q.type === 'written') {
                    innerHtml += `
                        <div class="mt-2">
                            <input type="text" class="form-control" name="q_${idx}" placeholder="Type your answer here..." required autocomplete="off">
                        </div>`;
                }

                card.innerHTML = innerHtml;
                questionsContainer.appendChild(card);
            });
        }

        testForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let correctCount = 0;

            generatedQuestions.forEach((q, idx) => {
                const selectedCard = document.querySelector(`[name="q_${idx}"]:checked`);
                const inputCard = document.querySelector(`input[name="q_${idx}"][type="text"]`);
                
                let userAnswer = '';
                if (selectedCard) {
                    userAnswer = selectedCard.value.trim();
                } else if (inputCard) {
                    userAnswer = inputCard.value.trim();
                }

                const cardEl = questionsContainer.children[idx];

                if (q.type === 'written') {
                    if (userAnswer.toLowerCase() === q.correct.toLowerCase()) {
                        correctCount++;
                        cardEl.style.borderColor = '#22c55e'; // Green border for correct
                    } else {
                        cardEl.style.borderColor = '#ef4444'; // Red border for incorrect
                        cardEl.innerHTML += `<div class="mt-3 text-danger small"><i class="fa-solid fa-xmark me-1"></i> Correct Answer: <strong>${escapeHtml(q.correct)}</strong></div>`;
                    }
                } else {
                    if (userAnswer === q.correct) {
                        correctCount++;
                        cardEl.style.borderColor = '#22c55e';
                    } else {
                        cardEl.style.borderColor = '#ef4444';
                        cardEl.innerHTML += `<div class="mt-3 text-danger small"><i class="fa-solid fa-xmark me-1"></i> Correct Answer: <strong>${escapeHtml(q.correct)}</strong></div>`;
                    }
                }
            });

            const percentage = Math.round((correctCount / generatedQuestions.length) * 100);
            scoreDisplay.textContent = `${percentage}%`;
            
            // Show results card and hide submit button
            resultsCard.classList.remove('d-none');
            submitContainer.classList.add('d-none');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        loadTestData();
    </script>
</body>
</html>
