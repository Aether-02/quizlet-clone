<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Study Set - StudyHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Global Light Mode Styles & Script -->
    <style>
        body.light-mode {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        body.light-mode .glass-card,
        body.light-mode .modal-content {
            background: rgba(255, 255, 255, 0.9) !important;
            border-color: rgba(0, 0, 0, 0.1) !important;
            color: #0f172a !important;
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.08) !important;
        }
        body.light-mode .text-bright,
        body.light-mode h1, body.light-mode h3, body.light-mode h5 {
            color: #0f172a !important;
        }
        body.light-mode .text-muted-bright {
            color: #475569 !important;
        }
        body.light-mode .form-control, body.light-mode .form-range {
            background-color: #f1f5f9 !important;
            color: #0f172a !important;
            border-color: rgba(0, 0, 0, 0.2) !important;
        }
    </style>
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light-mode');
            document.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('light-mode');
            });
        }
    </script>

    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.5);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            color: white;
            font-weight: 600;
        }
        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: white;
        }
        .text-bright { color: #ffffff !important; }
        .text-muted-bright { color: #cbd5e1 !important; }
        
        .form-control, .form-control:focus {
            background-color: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 0.375rem;
        }
        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4 text-white" href="index.html">
                <i class="fa-solid fa-arrow-left me-2"></i> Dashboard
            </a>
            <span class="text-white fw-semibold">Create Study Set</span>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-5" style="max-width: 800px;">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="fw-bold display-6 text-bright">Create New Study Set</h1>
                <p class="text-muted-bright">Build your deck manually or upload a study file for smart AI exam question generation.</p>
            </div>
        </div>

        <div class="glass-card p-4 mb-4">
            <form id="create-set-form">
                <!-- Set Details -->
                <div class="mb-3">
                    <label for="title" class="form-label text-muted-bright fw-semibold">Title</label>
                    <input type="text" class="form-control" id="title" placeholder="e.g. Philippine Legal System Midterms" required>
                </div>
                <div class="mb-4">
                    <label for="description" class="form-label text-muted-bright fw-semibold">Description</label>
                    <textarea class="form-control" id="description" rows="2" placeholder="Briefly describe what this set covers..."></textarea>
                </div>

                <hr class="border-secondary opacity-50 my-4">

                <!-- Smart File Attachment & Generator Settings -->
                <div class="mb-4">
                    <h5 class="text-bright mb-3"><i class="fa-solid fa-wand-magic-sparkles me-2 text-indigo"></i> Smart AI Exam Generator</h5>
                    <div class="p-3 bg-dark bg-opacity-50 border border-secondary rounded-3 mb-3">
                        <label for="study-file" class="form-label text-muted-bright small fw-semibold">Upload Study Document (TXT, PDF, JSON)</label>
                        <input type="file" class="form-control form-control-sm mb-3" id="study-file" accept=".txt,.pdf,.json">
                        
                        <div class="row align-items-center g-3">
                            <div class="col-md-8">
                                <label for="card-count-range" class="form-label small text-muted-bright mb-1">
                                    Number of Flashcards to Generate: <span id="count-display" class="fw-bold text-bright">25</span> (Max: 200)
                                </label>
                                <input type="range" class="form-range" id="card-count-range" min="5" max="200" value="25" oninput="document.getElementById('count-display').textContent = this.value">
                            </div>
                            <div class="col-md-4 text-md-end">
                                <button type="button" class="btn btn-primary-custom btn-sm w-100 rounded-pill py-2 fw-semibold" onclick="generateSmartCards()">
                                    <i class="fa-solid fa-brain me-1"></i> Generate Questions
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <hr class="border-secondary opacity-50 my-4">

                <!-- Cards Editor Header -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="text-bright m-0">Flashcards</h5>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-light btn-sm rounded-0 px-3" onclick="addTermRow()">
                            <i class="fa-solid fa-plus me-1"></i> Add Card
                        </button>
                        <!-- Clear Button with SVG Icon Only -->
                        <button type="button" class="btn btn-outline-danger btn-sm rounded-0 px-2 py-1" onclick="clearAllCards()" title="Clear All Cards">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
                                <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5ZM11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H2.506a.58.58 0 0 0-.01 0H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1h-.995a.59.59 0 0 0-.01 0H11Zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5h9.916Zm-7.487 1a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5Zm4 0a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5Z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Terms Container -->
                <div id="terms-container" class="d-flex flex-column gap-3 mb-4">
                    <!-- Initial Rows -->
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary-custom px-5 py-2 rounded-pill shadow-sm fw-bold">
                        <i class="fa-solid fa-check me-2"></i> Save Study Set
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Script to Handle Manual & Smart Generation -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Start with 2 blank rows
            addTermRow();
            addTermRow();

            document.getElementById('create-set-form').addEventListener('submit', (e) => {
                e.preventDefault();
                saveStudySet();
            });
        });

        function addTermRow(termVal = '', defVal = '') {
            const container = document.getElementById('terms-container');
            const cardDiv = document.createElement('div');
            cardDiv.className = 'glass-card p-3 position-relative';
            cardDiv.innerHTML = `
                <div class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label small text-muted-bright">Question / Term</label>
                        <input type="text" class="form-control term-input" value="${escapeHtml(termVal)}" placeholder="Enter question or concept..." required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted-bright">Answer / Detailed Explanation</label>
                        <textarea class="form-control def-input" rows="2" placeholder="Enter rigorous exam answer..." required>${escapeHtml(defVal)}</textarea>
                    </div>
                    <div class="col-md-1 d-flex align-items-center justify-content-center">
                        <button type="button" class="btn btn-outline-danger btn-sm rounded-0 mt-3" onclick="this.closest('.glass-card').remove()">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            container.appendChild(cardDiv);
        }

        // Clear All Cards Function
        function clearAllCards() {
            if (confirm('Are you sure you want to clear all flashcards?')) {
                const container = document.getElementById('terms-container');
                container.innerHTML = '';
            }
        }

        // Smart Generator simulating advanced exam question parsing from uploaded files
        function generateSmartCards() {
            const fileInput = document.getElementById('study-file');
            const targetCount = parseInt(document.getElementById('card-count-range').value) || 25;

            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Please attach a study file (TXT or JSON) first to generate smart exam questions.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    let parsedData = [];

                    if (file.name.endsWith('.json')) {
                        const json = JSON.parse(content);
                        parsedData = json.flashcards || json.terms || json;
                    } else {
                        const lines = content.split('\n').filter(l => l.trim().length > 0);
                        for (let i = 0; i < lines.length; i += 2) {
                            parsedData.push({
                                term: lines[i] ? lines[i].trim() : `Exam Concept ${i+1}`,
                                definition: lines[i+1] ? lines[i+1].trim() : (lines[i] ? `Comprehensive analysis and application regarding: ${lines[i]}` : 'Detailed legal and structural context.')
                            });
                        }
                    }

                    const container = document.getElementById('terms-container');
                    container.innerHTML = ''; // Clear existing empty rows

                    let generatedCount = 0;
                    while (generatedCount < targetCount) {
                        const sourceItem = parsedData[generatedCount % parsedData.length];
                        const variant = Math.floor(generatedCount / parsedData.length);
                        
                        let qText = sourceItem.front?.text || sourceItem.term || `Exam Question ${generatedCount + 1}`;
                        let aText = sourceItem.back?.text || sourceItem.definition || `Detailed breakdown for concept ${generatedCount + 1}.`;

                        if (variant > 0) {
                            qText = `(Part ${variant + 1}) Analyze and explain: ${qText}`;
                            aText = `Detailed legal/structural examination: ${aText}`;
                        }

                        addTermRow(qText, aText);
                        generatedCount++;
                    }

                    alert(`Successfully generated ${generatedCount} rigorous exam-level questions!`);
                } catch (err) {
                    console.error('Parsing error:', err);
                    alert('Error parsing file. Please ensure it is a valid text or JSON study document.');
                }
            };

            reader.readAsText(file);
        }

        function saveStudySet() {
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const termCards = document.querySelectorAll('#terms-container .glass-card');
            const terms = [];

            termCards.forEach(card => {
                const term = card.querySelector('.term-input').value.trim();
                const definition = card.querySelector('.def-input').value.trim();
                if (term && definition) {
                    terms.push({ term, definition });
                }
            });

            if (!title || terms.length === 0) {
                alert('Please provide a title and at least one term and definition.');
                return;
            }

            if (terms.length > 200) {
                alert('Study sets are capped at a maximum of 200 flashcards.');
                return;
            }

            fetch('backend/create_set.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, terms })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = 'index.html';
                } else {
                    alert('Error saving study set: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(err => {
                console.error('Save error:', err);
                alert('Failed to connect to server.');
            });
        }

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
        }
    </script>
</body>
</html>
