<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Study Set - StudyHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/transition.css">
    
    <!-- Universal Document Parsers -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Soft Baby Peach Pink & White Caramel Theme Styles -->
    <style>
        :root {
            --bg-main: #fff5f2; /* Soft white caramel / warm cream background */
            --sidebar-bg: #ffebe6; /* Soft peach tint */
            --card-bg: #ffffff;
            --text-main: #5c4033; /* Warm caramel text */
            --text-muted: #8c6d62;
            --accent-peach: #ffb5a7; /* Baby peach */
            --accent-caramel: #d8a47f;
            --btn-gradient: linear-gradient(135deg, #ffb5a7 0%, #fcd5ce 100%);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Collapsible Sidebar Styling */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid rgba(216, 164, 127, 0.2);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            padding: 1.5rem 1rem;
            z-index: 1050;
            transition: width 0.3s ease, transform 0.3s ease;
        }

        body.sidebar-collapsed .sidebar {
            width: 80px;
        }
        body.sidebar-collapsed .sidebar .sidebar-text,
        body.sidebar-collapsed .sidebar .sidebar-heading {
            display: none !important;
        }
        body.sidebar-collapsed .sidebar .sidebar-brand span {
            display: none !important;
        }
        body.sidebar-collapsed .main-content {
            margin-left: 80px !important;
        }

        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
        }

        .nav-link-custom {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            border-radius: 0.75rem;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
        }
        .nav-link-custom:hover, .nav-link-custom.active {
            background-color: rgba(255, 181, 167, 0.3);
            color: var(--text-main);
        }
        .nav-link-custom i {
            font-size: 1.2rem;
            min-width: 24px;
            text-align: center;
        }

        /* Main Content Area */
        .main-content {
            margin-left: 260px;
            flex-grow: 1;
            padding: 2rem 3rem;
            transition: margin-left 0.3s ease;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .btn-menu-toggle {
            background: rgba(255, 181, 167, 0.2);
            border: 1px solid rgba(216, 164, 127, 0.3);
            font-size: 1.2rem;
            color: var(--text-main);
            cursor: pointer;
            padding: 0.5rem 0.75rem;
            border-radius: 0.75rem;
            transition: background 0.2s;
        }
        .btn-menu-toggle:hover {
            background: rgba(255, 181, 167, 0.4);
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid rgba(216, 164, 127, 0.25);
            border-radius: 1.25rem;
            box-shadow: 0 8px 25px rgba(216, 164, 127, 0.08);
        }

        .form-control, .form-range {
            background-color: #ffffff !important;
            border: 1px solid rgba(216, 164, 127, 0.4) !important;
            color: var(--text-main) !important;
            border-radius: 0.5rem;
        }
        .form-control:focus {
            border-color: #ffb5a7 !important;
            box-shadow: 0 0 0 0.25rem rgba(255, 181, 167, 0.25) !important;
        }

        .btn-study {
            background: var(--btn-gradient);
            color: var(--text-main);
            border: none;
            font-weight: 600;
        }
        .btn-study:hover {
            opacity: 0.9;
            color: var(--text-main);
        }

        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);
            }
            body.mobile-sidebar-open .sidebar {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0 !important;
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Left Sidebar Navigation -->
    <nav class="sidebar">
        <a href="index.html" class="sidebar-brand">
            <i class="fa-solid fa-graduation-cap" style="color: #ffb5a7;"></i> <span class="sidebar-text">StudyHub</span>
        </a>
        <div class="d-flex flex-column gap-2 mb-4">
            <a href="index.html" class="nav-link-custom"><i class="fa-solid fa-house"></i> <span class="sidebar-text">Home</span></a>
            <a href="settings.html" class="nav-link-custom"><i class="fa-solid fa-gear"></i> <span class="sidebar-text">Settings</span></a>
        </div>
        <hr style="border-color: rgba(216, 164, 127, 0.2);">
        <div class="text-uppercase small fw-bold text-muted px-2 mb-2 sidebar-heading">Quick Start</div>
        <div class="d-flex flex-column gap-2">
            <a href="create-set.html" class="nav-link-custom active"><i class="fa-solid fa-layer-group"></i> <span class="sidebar-text">Flashcards</span></a>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="main-content">
        <!-- Top Bar -->
        <div class="top-bar">
            <button class="btn-menu-toggle" onclick="toggleSidebar()" title="Toggle Sidebar">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                <i class="fa-solid fa-arrow-left me-1"></i> Dashboard
            </a>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <h1 class="fw-bold display-6 mb-2">Create New Study Set</h1>
                <p class="text-muted">Build your deck manually or upload any document for smart exam question generation.</p>
            </div>
        </div>

        <div class="glass-card p-4 mb-4">
            <form id="create-set-form">
                <div class="mb-3">
                    <label for="title" class="form-label fw-semibold">Title</label>
                    <input type="text" class="form-control" id="title" placeholder="e.g. Philippine Legal System Midterms" required>
                </div>
                <div class="mb-4">
                    <label for="description" class="form-label fw-semibold">Description</label>
                    <textarea class="form-control" id="description" rows="2" placeholder="Briefly describe what this set covers..."></textarea>
                </div>

                <hr class="border-secondary opacity-25 my-4">

                <!-- Smart File Attachment & Generator Settings -->
                <div class="mb-4">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-wand-magic-sparkles me-2 text-dark"></i> Smart AI Exam Generator</h5>
                    <div class="p-3 rounded-3 mb-3" style="background: rgba(255, 235, 230, 0.5); border: 1px solid rgba(216, 164, 127, 0.3);">
                        <label for="study-file" class="form-label small fw-semibold">Upload Study Document (PDF, DOCX, XLSX, JSON, TXT)</label>
                        <input type="file" class="form-control form-control-sm mb-3" id="study-file" accept=".pdf,.docx,.doc,.xlsx,.xls,.csv,.json,.txt">
                        
                        <div class="row align-items-center g-3">
                            <div class="col-md-8">
                                <label for="card-count-range" class="form-label small text-muted mb-1">
                                    Number of Flashcards to Generate: <span id="count-display" class="fw-bold">25</span> (Max: 200)
                                </label>
                                <input type="range" class="form-range" id="card-count-range" min="5" max="200" value="25" oninput="document.getElementById('count-display').textContent = this.value">
                            </div>
                            <div class="col-md-4 text-md-end">
                                <button type="button" class="btn btn-study btn-sm w-100 rounded-pill py-2 fw-semibold shadow-sm" onclick="generateSmartCards()">
                                    <i class="fa-solid fa-brain me-1"></i> Generate Questions
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <hr class="border-secondary opacity-25 my-4">

                <!-- Cards Editor Header -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0">Flashcards</h5>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-dark btn-sm rounded-0 px-3" onclick="addTermRow()">
                            <i class="fa-solid fa-plus me-1"></i> Add Card
                        </button>
                        <button type="button" class="btn btn-outline-danger btn-sm rounded-0 px-2 py-1" onclick="clearAllCards()" title="Clear All Cards">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
                                <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5ZM11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H2.506a.58.58 0 0 0-.01 0H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1h-.995a.59.59 0 0 0-.01 0H11Zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5h9.916Zm-7.487 1a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5Zm4 0a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5Z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Terms Container -->
                <div id="terms-container" class="d-flex flex-column gap-3 mb-4"></div>

                <div class="text-end">
                    <button type="submit" class="btn btn-study px-5 py-2 rounded-pill shadow-sm fw-bold">
                        <i class="fa-solid fa-check me-2"></i> Save Study Set
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Script -->
    <script>
        function toggleSidebar() {
            if (window.innerWidth <= 992) {
                document.body.classList.toggle('mobile-sidebar-open');
            } else {
                document.body.classList.toggle('sidebar-collapsed');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            addTermRow();
            addTermRow();

            document.getElementById('create-set-form').addEventListener('submit', (e) => {
                e.preventDefault();
                saveStudySet();
            });
        });

        function addTermRow(termVal = '', defVal = '') {
            const container = document.getElementById('terms-container');
            const cardDiv = document.createElement('div');
            cardDiv.className = 'glass-card p-3 position-relative';
            cardDiv.innerHTML = `
                <div class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label small text-muted">Question / Term</label>
                        <input type="text" class="form-control term-input" value="${escapeHtml(termVal)}" placeholder="Enter question or concept..." required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted">Answer / Detailed Explanation</label>
                        <textarea class="form-control def-input" rows="2" placeholder="Enter rigorous exam answer..." required>${escapeHtml(defVal)}</textarea>
                    </div>
                    <div class="col-md-1 d-flex align-items-center justify-content-center">
                        <button type="button" class="btn btn-outline-danger btn-sm rounded-0 mt-3" onclick="this.closest('.glass-card').remove()">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            container.appendChild(cardDiv);
        }

        function clearAllCards() {
            if (confirm('Are you sure you want to clear all flashcards?')) {
                document.getElementById('terms-container').innerHTML = '';
            }
        }

        async function generateSmartCards() {
            const fileInput = document.getElementById('study-file');
            const targetCount = parseInt(document.getElementById('card-count-range').value) || 25;

            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Please attach a study document first.');
                return;
            }

            const file = fileInput.files[0];
            const fileName = file.name.toLowerCase();
            let parsedData = [];

            try {
                if (fileName.endsWith('.pdf')) {
                    parsedData = await parsePDF(file);
                } else if (fileName.endsWith('.docx') || fileName.endsWith('.doc')) {
                    parsedData = await parseDOCX(file);
                } else if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls') || fileName.endsWith('.csv')) {
                    parsedData = await parseExcel(file);
                } else if (fileName.endsWith('.json')) {
                    parsedData = await parseJSON(file);
                } else {
                    parsedData = await parseTXT(file);
                }

                if (!parsedData || parsedData.length === 0) {
                    alert('Could not extract readable text from this file.');
                    return;
                }

                const container = document.getElementById('terms-container');
                container.innerHTML = '';

                let generatedCount = 0;
                while (generatedCount < targetCount) {
                    const sourceItem = parsedData[generatedCount % parsedData.length];
                    addTermRow(sourceItem.term, sourceItem.definition);
                    generatedCount++;
                }

                alert(`Successfully generated ${generatedCount} exam-level questions from ${file.name}!`);
            } catch (err) {
                console.error('File parsing error:', err);
                alert('Error processing file. Please ensure the file is valid.');
            }
        }

        async function parsePDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let extractedText = '';

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                if (!pageText.includes('%PDF-') && !pageText.includes('obj <<')) {
                    extractedText += pageText + '\n';
                }
            }
            return textToCards(extractedText);
        }

        async function parseDOCX(file) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
            return textToCards(result.value);
        }

        async function parseExcel(file) {
            const arrayBuffer = await file.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            let combinedText = '';

            workbook.SheetNames.forEach(sheetName => {
                const sheet = workbook.Sheets[sheetName];
                const csv = XLSX.utils.sheet_to_csv(sheet);
                combinedText += csv + '\n';
            });
            return textToCards(combinedText);
        }

        async function parseJSON(file) {
            const text = await file.text();
            const json = JSON.parse(text);
            const rawCards = json.flashcards || json.terms || json;
            return rawCards.map(item => ({
                term: item.front?.text || item.term || item.question || 'Concept',
                definition: item.back?.text || item.definition || item.answer || 'Explanation.'
            }));
        }

        async function parseTXT(file) {
            const text = await file.text();
            return textToCards(text);
        }

        function textToCards(text) {
            const sentences = text.split(/(?<=[.?!])\s+/).map(s => s.trim()).filter(s => s.length > 10);
            let cards = [];
            
            for (let i = 0; i < sentences.length; i += 2) {
                if (sentences[i] && sentences[i+1]) {
                    cards.push({
                        term: `Explain: ${sentences[i]}`,
                        definition: sentences[i+1]
                    });
                }
            }
            
            if (cards.length === 0 && sentences.length > 0) {
                for (let i = 0; i < sentences.length; i++) {
                    cards.push({
                        term: `Concept ${i+1}`,
                        definition: sentences[i]
                    });
                }
            }
            return cards;
        }

        function saveStudySet() {
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const termCards = document.querySelectorAll('#terms-container .glass-card');
            const terms = [];

            termCards.forEach(card => {
                const term = card.querySelector('.term-input').value.trim();
                const definition = card.querySelector('.def-input').value.trim();
                if (term && definition) {
                    terms.push({ term, definition });
                }
            });

            if (!title || terms.length === 0) {
                alert('Please provide a title and at least one term and definition.');
                return;
            }

            if (terms.length > 200) {
                alert('Study sets are capped at a maximum of 200 flashcards.');
                return;
            }

            fetch('backend/create_set.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, terms })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = 'index.html';
                } else {
                    alert('Error saving study set: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(err => {
                console.error('Save error:', err);
                alert('Failed to connect to server.');
            });
        }

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
        }
    </script>
</body>
</html>
